# Builds the site on every push to main and publishes the built files to the `deploy`
# branch. Hostinger's Git deployment pulls `deploy` into public_html, triggered by its
# auto-deploy webhook (added under GitHub → Settings → Webhooks).
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --outDir dist --emptyOutDir
      - name: Publish dist/ to the deploy branch
        working-directory: dist
        run: |
          git init -q -b deploy
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
